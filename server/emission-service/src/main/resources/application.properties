# Server
server.port=8082
spring.application.name=emission-service


# Database
spring.datasource.url=jdbc:sqlserver://192.168.103.126:1433;databaseName=MES_DB;encrypt=true;trustServerCertificate=true
spring.datasource.username=ADMIN
spring.datasource.password=ADMIN
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
# Les tables resident dans le schema « carbone » ; le schema par defaut du
# compte ADMIN etant « dbo », les requetes non qualifiees echouent sans ceci.
spring.jpa.properties.hibernate.default_schema=carbone

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
# Taux de change pour les facteurs monetaires (unites de devise par 1 TND).
# Aucun service de taux n'existant dans le projet, ces valeurs sont a reviser
# periodiquement.
emission.exchange-rates.eur=0.29
emission.exchange-rates.mad=3.20
emission.exchange-rates.usd=0.32

# Depot de fichiers volumineux (referentiel carbone)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
