# Server
server.port=8084
spring.application.name=data-import-service

# Database
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=MisfatDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Misfat2026&
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Erreurs : jamais de stack trace dans la reponse HTTP (les logs les conservent)
server.error.include-stacktrace=never
server.error.include-message=always

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

# Depot de fichiers volumineux (referentiel carbone)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
