<section class="chart-card">
  <header class="chart-head">
    <div>
      <h2>Évolution des cours de change</h2>
      <p>
        Référentiel MISFAT Tunisie · dinar tunisien en devise de contrepartie
        <span *ngIf="nbPoints">— {{ nbPoints }} points tracés</span>
      </p>
    </div>

    <div class="legend" *ngIf="devisesTracees.length">
      <span class="legend-item" *ngFor="let d of devisesTracees">
        <i class="legend-dot" [style.background]="d.couleur"></i>
        {{ d.code }}
        <strong *ngIf="d.dernier !== null">{{ d.dernier | number:'1.3-3' }}</strong>
      </span>
    </div>
  </header>

  <div class="chart-body">
    <div class="chart-state" *ngIf="chargement">Chargement des cours…</div>
    <div class="chart-state chart-error" *ngIf="erreur">{{ erreur }}</div>

    <div class="canvas-wrap" [class.hidden]="chargement || erreur">
      <canvas #canvas></canvas>
    </div>
  </div>

  <footer class="chart-note" *ngIf="devisesAbsentes.length && !chargement && !erreur">
    Aucune cotation en base pour : {{ devisesAbsentes.join(', ') }}.
  </footer>
</section>
